<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rotas GO — Dispatch V6</title>

  <style>
    body {
      font-family: system-ui;
      margin: 0;
      background: #f1f5f9;
      color: #0f172a;
    }

    header {
      background: #f97316;
      color: #fff;
      padding: 18px;
    }

    main {
      max-width: 900px;
      margin: 18px auto;
      padding: 0 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: 0 2px 10px #0001;
    }

    input,
    button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font: inherit;
    }

    button {
      background: #f97316;
      color: #fff;
      border: 0;
      font-weight: 800;
      cursor: pointer;
    }

    .ok {
      background: #dcfce7;
      padding: 10px;
      border-radius: 10px;
    }

    .warn {
      background: #fef3c7;
      padding: 10px;
      border-radius: 10px;
    }

    .offer {
      background: #fff7ed;
      border: 2px solid #f97316;
      padding: 14px;
      border-radius: 14px;
    }

    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<header>
  <h1>🚕 Rotas GO — Dispatch V6</h1>
  <div>Teste: localizar → chamar → aceitar/recusar</div>
</header>

<main>

  <!-- MOTORISTA -->
  <section class="card">

    <h2>👤 Simular motorista</h2>

    <input
      id="driverId"
      value="DRV-34912"
      placeholder="ID do motorista"
    >

    <input
      id="lat"
      placeholder="Latitude"
      value="-16.3265"
    >

    <input
      id="lng"
      placeholder="Longitude"
      value="-48.9528"
    >

    <button onclick="connectDriver()">
      🟢 Conectar motorista
    </button>

    <button onclick="sendLocation()">
      📍 Enviar localização
    </button>

    <div id="driverStatus" class="warn">
      Offline
    </div>

  </section>


  <!-- CLIENTE -->
  <section class="card">

    <h2>👤 Simular cliente</h2>

    <input
      id="pickupLabel"
      value="Av. Brasil, Anápolis"
      placeholder="Origem"
    >

    <input
      id="pickupLat"
      value="-16.3265"
      placeholder="Latitude origem"
    >

    <input
      id="pickupLng"
      value="-48.9520"
      placeholder="Longitude origem"
    >

    <input
      id="destLabel"
      value="Centro, Anápolis"
      placeholder="Destino"
    >

    <input
      id="destLat"
      value="-16.3280"
      placeholder="Latitude destino"
    >

    <input
      id="destLng"
      value="-48.9535"
      placeholder="Longitude destino"
    >

    <button onclick="requestRide()">
      🚕 Pedir corrida
    </button>

    <pre id="rideResult">
Nenhuma corrida.
    </pre>

  </section>


  <!-- OFERTA -->
  <section class="card">

    <h2>📱 Oferta recebida pelo motorista</h2>

    <div id="offer">
      Nenhuma oferta.
    </div>

  </section>


  <!-- LOG -->
  <section class="card">

    <h2>🔌 Diagnóstico</h2>

    <pre id="log"></pre>

  </section>

</main>


<script>

let ws = null;
let currentRide = null;

const $ = id => document.getElementById(id);


function log(x) {

  $("log").textContent =
    JSON.stringify(x, null, 2);

}


/* =========================
   LOCALIZAÇÃO DO MOTORISTA
========================= */

async function sendLocation() {

  const body = {

    driverId: $("driverId").value,

    lat: Number($("lat").value),

    lng: Number($("lng").value),

    accuracy: 10

  };


  const response = await fetch(
    "/api/location/update",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(body)
    }
  );


  log(await response.json());

}


/* =========================
   CONECTAR MOTORISTA
========================= */

function connectDriver() {

  const id =
    $("driverId").value.trim();


  if (ws) {
    ws.close();
  }


  const protocol =
    location.protocol === "https:"
      ? "wss"
      : "ws";


  ws = new WebSocket(
    `${protocol}://${location.host}/ws?driverId=${encodeURIComponent(id)}`
  );


  ws.onopen = () => {

    $("driverStatus").className = "ok";

    $("driverStatus").textContent =
      "🟢 Conectado ao backend";


    // envia a localização assim que conecta
    sendLocation();

  };


  ws.onclose = () => {

    $("driverStatus").className = "warn";

    $("driverStatus").textContent =
      "🔴 WebSocket offline";

  };


  ws.onmessage = event => {

    const message =
      JSON.parse(event.data);


    if (message.type === "RIDE_OFFER") {

      currentRide = message;

      renderOffer(message);

    }

    else if (
      message.type === "RIDE_OFFER_EXPIRED"
    ) {

      renderOffer({

        expired: true,

        rideId: message.rideId

      });

    }


    log(message);

  };

}


/* =========================
   MOSTRAR OFERTA
========================= */

function renderOffer(message) {

  if (message.expired) {

    $("offer").innerHTML =
      "<b>⌛ Oferta expirada</b>";

    return;

  }


  $("offer").innerHTML = `

    <div class="offer">

      <h3>🚕 Nova corrida</h3>

      <p>
        📍 ${message.pickup.label}
      </p>

      <p>
        🎯 ${message.destination.label}
      </p>

      <p>
        📏 ${message.distanceToPickupKm} km
      </p>

      <p>
        ⏱️ Responda antes de expirar.
      </p>

      <button onclick="respond('ACCEPT')">
        ✅ ACEITAR
      </button>

      <button onclick="respond('REJECT')">
        ❌ RECUSAR
      </button>

    </div>

  `;

}


/* =========================
   CLIENTE PEDE CORRIDA
========================= */

async function requestRide() {

  const body = {

    pickup: {

      label:
        $("pickupLabel").value,

      lat:
        Number($("pickupLat").value),

      lng:
        Number($("pickupLng").value)

    },

    destination: {

      label:
        $("destLabel").value,

      lat:
        Number($("destLat").value),

      lng:
        Number($("destLng").value)

    }

  };


  const response = await fetch(
    "/api/rides",
    {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(body)

    }
  );


  const data =
    await response.json();


  currentRide =
    data.ride;


  $("rideResult").textContent =
    JSON.stringify(data, null, 2);


  log(data);

}


/* =========================
   MOTORISTA ACEITA / RECUSA
========================= */

async function respond(action) {

  if (!currentRide) {

    return;

  }


  const rideId =
    currentRide.rideId ||
    currentRide.id;


  const response = await fetch(

    `/api/rides/${rideId}/respond`,

    {

      method: "POST",

      headers: {

        "Content-Type":
          "application/json"

      },

      body: JSON.stringify({

        driverId:
          $("driverId").value,

        action

      })

    }

  );


  const data =
    await response.json();


  $("rideResult").textContent =
    JSON.stringify(
      data,
      null,
      2
    );


  if (action === "ACCEPT") {

    $("offer").innerHTML = `

      <div class="ok">

        ✅ Corrida aceita!

      </div>

    `;

  }

  else {

    $("offer").innerHTML = `

      <div class="warn">

        ❌ Recusada.
        Backend procurando
        o próximo motorista...

      </div>

    `;

  }


  log(data);

}

</script>

</body>
</html>
